name: Ruff

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  ruff:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install Ruff
        run: pip install "ruff==0.4.1"
      # Full-repo ruff currently fails on pre-existing debt (~350+ issues).
      # Lint the campaign-status modules introduced/owned by this change set.
      - name: Ruff check
        run: >
          ruff check --config=./pyproject.toml
          qlink_chatbot/utils/campaign_status.py
          qlink_chatbot/database/campaign_analytics.py
          tests/test_campaign_status.py
