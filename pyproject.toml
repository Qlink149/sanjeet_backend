[project]
name = "sanjeet-bot"
version = "0.1.0"
description = "Sanjeet WhatsApp nurture bot"
requires-python = ">=3.12"
dependencies = [
    "fastapi[all]==0.111.0",
    "httpx",
    "openai",
    "pinecone",
    "pymongo",
    "python-dotenv",
    "pytz",
    "gspread",
    "google-auth",
    "google-auth-oauthlib",
    "google-auth-httplib2",
    "pandas",
    "openpyxl",
    "xlrd",
    "python-multipart",
    "aiofiles",
    "apscheduler",
]

[tool.poetry]
name = "qlink-chatbot"
version = "0.1.0"
description = ""
authors = ["Jay shah <jayshah0726@gmail.com>"]
readme = "README.md"
packages = [
    { include = "qlink_chatbot", from = "." },
]

[tool.poetry.dependencies]
python = ">=3.12"

[tool.poetry.group.dev.dependencies]
ruff = "0.4.1"
pre-commit = "3.7.0"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["qlink_chatbot"]

[tool.ruff]
line-length = 80
indent-width = 4
target-version = "py310"
extend-exclude = [
    "__init__.py",
    "migrations",
]

[tool.ruff.lint]
extend-select = [
    "UP", # pyupgrade
    "E", # pycodestyle
    "I", # isort
    "D", # pydocstyle
]

ignore = [
    "D100", # undocumented-public-module
    "D104", # undocumented-public-package
    "D106", # undocumented-public-nested-class
    "D107", # undocumented-public-init
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.pycodestyle]
max-line-length = 100

[tool.ruff.format]
indent-style = "space"
quote-style = "double"

[tool.vercel]
entrypoint = "qlink_chatbot.main:app"
